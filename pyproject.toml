[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paxel-workspace"
version = "0.1.0"
description = "Diagnose and recover workspace-scoped Codex and Antigravity sessions for Paxel"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["zstandard>=0.23,<1"]
classifiers = ["Operating System :: POSIX", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2", "twine>=6,<8", "detect-secrets>=1.5,<2"]

[project.urls]
Repository = "https://github.com/ymaini/paxel-workspace-recovery"
Issues = "https://github.com/ymaini/paxel-workspace-recovery/issues"

[project.scripts]
paxel-workspace = "paxel_workspace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
